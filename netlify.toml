# Netlify-konfiguration för frontend (statisk Vite-build).
# Databas och Edge Function ligger kvar på Supabase; Netlify hostar bara gränssnittet.
#
# base    = mappen Netlify kör bygget i (frontend/)
# publish = sökväg till färdig build, RELATIVT base -> frontend/dist
# command = byggkommandot, körs i base-mappen
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# Pinna Node-versionen så Netlify bygger med samma major som projektet kräver (24).
# Fel/äldre Node-default kan ge långsam eller trasig install (vite@7/vitest@2).
[build.environment]
  NODE_VERSION = "24"

# SPA-fallback: appen använder hash-routing, men detta säkerställer att alla sökvägar
# serverar index.html så att en direkt träff på t.ex. "/" alltid fungerar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
