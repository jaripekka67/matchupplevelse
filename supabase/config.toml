# Konfiguration för lokal Supabase. Portarna är förskjutna (+100 mot CLI:ns standard) så att
# den här stacken kan köras samtidigt som andra lokala Supabase-projekt (t.ex. ledarportalen).
# För fullständig referens: https://supabase.com/docs/guides/local-development/cli/config
project_id = "matchupplevelse"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54422
shadow_port = 54420
major_version = 17

[db.pooler]
enabled = false
port = 54429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54423
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5500"
additional_redirect_urls = ["http://127.0.0.1:5500", "http://localhost:5500"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
# Lokalt: ingen e-postbekräftelse krävs, så testanvändare kan logga in direkt.
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8183
deno_version = 2

[analytics]
enabled = false

# fogis-api kontrollerar inloggning själv (användarens JWT skickas vidare till RLS via asCaller),
# men vi låter gatewayen verifiera JWT som standard. Ingen särskild override behövs.
